# YOLO11-S + MobileNetV3 + single-point ECA at PAN P4 fusion.
# MBV3 backbone is unchanged from yolov11s_mbv3.yaml.

nc: 10
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, TorchVision, [960, mobilenet_v3_large, DEFAULT, True, 2, True]]
  - [0, 1, Index, [40, 5]]
  - [0, 1, Index, [112, 12]]
  - [0, 1, Index, [960, 17]]

  - [1, 1, Conv, [256, 1, 1]]
  - [2, 1, Conv, [512, 1, 1]]
  - [3, 1, Conv, [1024, 1, 1]]

head:
  - [6, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 5], 1, Concat, [1]]
  - [-1, 1, ECA, [3]]  # SP4-ECA: inserted after PAN P4 concat, before C3k2.
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[13, 16, 19], 1, Detect, [nc]]
