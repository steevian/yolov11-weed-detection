# YOLO11-S + MobileNetV3 + ECA2 (revised)
# Design constraints:
# 1) Keep MobileNetV3 backbone and channel adapters unchanged.
# 2) Insert ECA only on P3/P4/P5 outputs (total 3 modules).
# 3) Do not place attention blocks inside neck/PAN paths.

nc: 10
scales:
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, TorchVision, [960, mobilenet_v3_large, DEFAULT, True, 2, True]]
  - [0, 1, Index, [40, 5]]
  - [0, 1, Index, [112, 12]]
  - [0, 1, Index, [960, 17]]

  - [1, 1, Conv, [256, 1, 1]]
  - [2, 1, Conv, [512, 1, 1]]
  - [3, 1, Conv, [1024, 1, 1]]

  - [4, 1, ECA, [3]]
  - [5, 1, ECA, [3]]
  - [6, 1, ECA, [5]]

head:
  - [9, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [1024, True]]

  - [[15, 18, 21], 1, Detect, [nc]]